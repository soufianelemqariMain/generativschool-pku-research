[metadata]
name = generativschool-pku-public
version = 1.0.1
author = Soufiane Lemqari
license = MIT (original code and tests only); third-party data CC BY 4.0; original documentation reserved
license_files =
    LICENSE
    NOTICE.md
description = Demonstrateur de recherche PAH GroEL/ES, sans validation clinique
[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True
[options.packages.find]
where = src
[options.package_data]
pku_public = bundle/data/*, bundle/sources/*, bundle/reference/*, bundle/configs/*, bundle/*.json, bundle/*.md
[options.entry_points]
console_scripts =
    pku-public = pku_public.cli:main
